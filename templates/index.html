<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阮慶兒 的個人首頁</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(to bottom, #f0f4f0, #e0e8e0);
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 40px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .grid-item {
            padding: 20px 10px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            filter: brightness(1.1);
        }
        /* Màu sắc các nút giống thầy */
        .btn-blue { background-color: #5bc0de; }
        .btn-green { background-color: #5cb85c; }
        .btn-teal { background-color: #008080; }
        .btn-orange { background-color: #f0ad4e; }
        .btn-purple { background-color: #9370db; }
        .btn-dark { background-color: #555; }
    </style>
</head>
<body>

    <h1>阮慶兒 的個人首頁</h1>

    <div class="grid-container">
        <a href="#" class="grid-item btn-blue">課程資訊</a>
        <a href="#" class="grid-item btn-blue">今天日期</a>
        <a href="#" class="grid-item btn-blue">關於阮慶兒</a>
        <a href="#" class="grid-item btn-blue">GET 傳值範例</a>

        <a href="#" class="grid-item btn-blue">帳密 POST 驗證</a>
        <a href="#" class="grid-item btn-green">基礎數學與根號</a>
        <a href="#" class="grid-item btn-green">進階二次與根號</a>
        <a href="#" class="grid-item btn-orange">線上樂透</a>

        <a href="#" class="grid-item btn-blue">Firestore 資料讀取</a>
        <a href="#" class="grid-item btn-blue">教師姓名查詢</a>
        <a href="#" class="grid-item btn-blue">爬取課程</a>
        <a href="#" class="grid-item btn-orange">爬取即將上映電影</a>

        <a href="#" class="grid-item btn-blue">爬取電影資料庫</a>
        <a href="#" class="grid-item btn-blue">查詢電影資料庫</a>
        <a href="#" class="grid-item btn-blue">本週新片DB</a>
        <a href="#" class="grid-item btn-orange">十大肇事路口</a>

        <a href="#" class="grid-item btn-orange">查詢縣市天氣</a>
        <a href="/demo" class="grid-item btn-dark">聊天機器人</a>
        <a href="/demo" class="grid-item btn-dark">聊天機器人(2B)</a>
    </div>

</body>
</html>
