<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>查詢電影 - 阮慶兒</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #fce4ec; padding: 50px; text-align: center; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ddd; }
        button { padding: 10px 20px; background-color: #ba68c8; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result-card { background: white; padding: 15px; margin: 10px auto; border-radius: 10px; width: 50%; border-left: 5px solid #ba68c8; }
        .back-link { display: inline-block; margin-top: 20px; color: #ba68c8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🔍 查詢電影資料庫</h2>
    <form method="POST">
        <input type="text" name="keyword" placeholder="輸入電影關鍵字 (如: 小丑)..." value="{{ keyword }}">
        <button type="submit">查詢</button>
    </form>

    {% if movies %}
        <h3>找到 {{ movies|length }} 部相關電影:</h3>
        {% for movie in movies %}
        <div class="result-card">
            <p><strong>{{ movie.title }}</strong> - 上映日期: {{ movie.release_date }}</p>
        </div>
        {% endfor %}
    {% elif keyword %}
        <p>找不到關於 "{{ keyword }}" 的電影。</p>
    {% endif %}

    <br>
    <a href="/" class="back-link">⬅ 返回 阮慶兒 的首頁</a>
</body>
</html>
