<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人臉辨識系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f6f9; text-align: center; }
        .container { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .camera-box { width: 320px; height: 240px; background: #333; margin: 20px auto; border-radius: 10px; display: flex; color: #aaa; align-items: center; justify-content: center; border: 4px solid #17a2b8; position: relative; overflow: hidden; }
        .scan-line { position: absolute; width: 100%; height: 4px; background: #00ff00; top: 0; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 50% { top: 236px; } 100% { top: 0; } }
        .btn { background: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .result { margin-top: 25px; padding: 15px; background: #e2f0d9; color: #385723; border-radius: 8px; border: 1px solid #c5e0b4; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👤 AI 智能人臉安全辨識系統</h2>
        <p>請面向鏡頭進行特徵點掃描與身份核對：</p>
        
        <div class="camera-box">
            <div class="scan-line"></div>
            <span>📷 [ 鏡頭已啟動 / 偵測人臉中 ]</span>
        </div>

        <form method="POST">
            <button type="submit" class="btn">立即進行人臉比對</button>
        </form>

        {% if status == "success" %}
            <div class="result">
                🎯 辨識結果：身份驗證成功！<br>
                歡迎登入系統，靜宜資管 阮慶兒 同學。
            </div>
        {% endif %}
        <br><br>
        <a href="/" style="color: #6c757d; text-decoration: none;">&larr; 返回首頁</a>
    </div>
</body>
</html>
